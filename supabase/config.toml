# Supabase CLI settings for deploying CranGuys's Edge Function (see SUPABASE_SETUP.md).
# project_id is your project's reference: the part before .supabase.co in its URL.
project_id = "cranguys"

# cg-api checks the player's sign-in token itself (handler.js), so the gateway's own JWT check is turned
# off. This also lets it work with Supabase's new publishable / secret API keys.
[functions.cg-api]
verify_jwt = false
